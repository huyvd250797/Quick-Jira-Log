<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <defs>
    <linearGradient id="horizontal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".20" stop-color="white"/>
      <stop offset=".95" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".08" stop-color="white"/>
      <stop offset=".88" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="vertical-edge" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000" style="mask-type:alpha">
      <rect width="1000" height="1000" fill="url(#vertical)"/>
    </mask>
  </defs>
  <rect width="1000" height="1000" fill="url(#horizontal)" mask="url(#vertical-edge)"/>
</svg>
